name: ci

# 桌面外壳用 systray，必须开 CGO，因此只能在带图形工具链的真实系统上构建：
# Windows 用 runner 自带的 MinGW，macOS 用系统 clang。两个平台各建一次，
# 顺便守住"核心库不含平台相关代码"这条约束（Linux 由 idlemem-core 的 CI 覆盖）。
# 核心库按版本号从模块代理拉取，无需同时检出 idlemem-core。
on:
  push:
    branches: [master, main]
    # 打 tag 时同样出包，版本号由 GITHUB_REF_NAME 注入托盘
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: src/idlemem-desktop

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/idlemem-desktop/go.mod
          cache-dependency-path: src/idlemem-desktop/go.sum

      - name: Show the C toolchain
        working-directory: src/idlemem-desktop
        run: gcc --version

      - name: Vet
        working-directory: src/idlemem-desktop
        run: go vet ./...

      - name: Build tray
        working-directory: src/idlemem-desktop
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -X main.version=${env:GITHUB_REF_NAME}" -o xiancun-tray.exe ./cmd/xiancun-tray

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: xiancun-tray-windows_amd64
          path: src/idlemem-desktop/xiancun-tray.exe

  build-macos:
    # macOS runner 会因容量排队被平台取消，取消不应把整轮 CI 判红：
    # Windows 侧已完整验证；macOS 产物属于"可构建、未做真机交互验证"，
    # 该限制在 README「已知限制」里对外说明。
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: src/idlemem-desktop

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/idlemem-desktop/go.mod
          cache-dependency-path: src/idlemem-desktop/go.sum

      # 产物要挂到 Release 供人下载，名字里的架构必须与真实产物一致，
      # 不能在 arm64 runner 上打出来的二进制叫 darwin_amd64。
      - name: Report target arch
        id: arch
        working-directory: src/idlemem-desktop
        run: echo "arch=$(go env GOARCH)" >> "$GITHUB_OUTPUT"

      - name: Vet
        working-directory: src/idlemem-desktop
        run: go vet ./...

      - name: Build tray
        working-directory: src/idlemem-desktop
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o xiancun-tray ./cmd/xiancun-tray

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: xiancun-tray-darwin_${{ steps.arch.outputs.arch }}
          path: src/idlemem-desktop/xiancun-tray
